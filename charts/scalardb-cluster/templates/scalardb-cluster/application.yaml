{{- if eq .Values.global.platform "google" }}
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: "{{ .Release.Name }}"
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: "{{ .Release.Name }}"
  annotations:
    marketplace.cloud.google.com/deploy-info: '{"partner_id": "scalarlabs", "product_id": "scalardb-cluster-enterprise-{{ .Values.global.google.edition }}", "partner_name": "Scalar, Inc."}'
    kubernetes-engine.cloud.google.com/icon: >-
      data:image/png;base64,
spec:
  descriptor:
    type: ScalarDB Cluster
    version: '{{ .Chart.AppVersion }}'
    description: >-
      ScalarDB Cluster is a distributed transaction manager and query
      engine that spans multiple, possibly heterogeneous, databases.
    maintainers:
      - name: Scalar, Inc.
        url: https://scalar-labs.com/
    links:
      - description: ScalarDB Documentation
        url: https://scalardb.scalar-labs.com/
  selector:
    matchLabels:
      {{- include "scalardb-cluster.selectorLabels" . | nindent 6 }}
  addOwnerRef: true
  componentKinds:
    - group: apps
      kind: Deployment
    - group: ''
      kind: Service
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: ServiceAccount
    {{/*
    Role/RoleBinding are intentionally excluded from componentKinds:
    they are provisioned by Google Cloud Marketplace's deployer, not by
    this chart, so they are not part of this Application's own resources.
    */}}
  info:
    - name: ScalarDB Cluster endpoint
      type: Reference
      valueFrom:
        type: ServiceRef
        serviceRef:
          name: "{{ include "scalardb-cluster.fullname" . }}-endpoint"
          port: {{ (index .Values.scalardbCluster.service.ports "scalardb-cluster").port }}
{{- end }}
