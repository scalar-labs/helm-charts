{{/*
This Role is not created for the "google" platform because Google Cloud
Marketplace's deployer provisions the equivalent RBAC resources itself as
part of the Application installation.
*/}}
{{- if ne .Values.global.platform "google" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "scalardb-cluster.fullname" . }}-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "watch", "list"]
  {{- if and (.Values.scalardbCluster.encryption.enabled) (eq .Values.scalardbCluster.encryption.type "self") }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
  {{- end }}
{{- end }}
