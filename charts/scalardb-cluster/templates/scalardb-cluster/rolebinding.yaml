{{/*
This RoleBinding is not created for the "google" platform because Google
Cloud Marketplace's deployer provisions the equivalent RBAC resources
itself as part of the Application installation.
*/}}
{{- if ne .Values.global.platform "google" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "scalardb-cluster.fullname" . }}-rolebinding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "scalardb-cluster.serviceAccountName" . }}
roleRef:
  kind: Role
  name: {{ include "scalardb-cluster.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
