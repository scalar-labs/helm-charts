apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scalardb-saga-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scalardb-saga-server.labels" . | nindent 4 }}
data:
  server.properties: |
    {{- include "scalardb-saga-server.properties" . | trimSuffix "\n" | nindent 4 }}
