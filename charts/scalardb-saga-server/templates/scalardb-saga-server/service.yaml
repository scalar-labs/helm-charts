apiVersion: v1
kind: Service
metadata:
  name: {{ include "scalardb-saga-server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scalardb-saga-server.labels" . | nindent 4 }}
  {{- with .Values.scalarDbSagaServer.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.scalarDbSagaServer.service.type }}
  ports:
    - port: {{ .Values.scalarDbSagaServer.service.http.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.scalarDbSagaServer.service.grpc.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "scalardb-saga-server.selectorLabels" . | nindent 4 }}
